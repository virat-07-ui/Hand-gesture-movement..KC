<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music + Hand Reactive Particles</title>

<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial}
#start{
  position:fixed;inset:0;display:flex;
  align-items:center;justify-content:center;
  color:#0ff;font-size:22px;background:black;
  cursor:pointer;z-index:10;
}
#videoBox{
  position:absolute;bottom:15px;right:15px;
  width:160px;height:120px;border:2px solid #0ff;
  border-radius:10px;overflow:hidden;
  transform:scaleX(-1);
}
video{width:100%;height:100%;object-fit:cover}
#ui{position:absolute;top:15px;left:15px;color:#0ff}
</style>
</head>

<body>

<div id="start">CLICK TO START</div>

<div id="ui">
  <div id="mode">MODE: SPHERE</div>
  <div>✊ Fist = Attract</div>
  <div>🤏 Pinch = Change Shape</div>
  <div>🎵 Sound = Pulse</div>
</div>

<div id="videoBox">
  <video id="video" autoplay playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* THREE */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=30;

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* PARTICLES */
const COUNT=6000;
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(COUNT*3);
const col=new Float32Array(COUNT*3);

for(let i=0;i<COUNT;i++){
  pos[i*3]=(Math.random()-0.5)*40;
  pos[i*3+1]=(Math.random()-0.5)*40;
  pos[i*3+2]=(Math.random()-0.5)*40;
}
geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
geo.setAttribute("color",new THREE.BufferAttribute(col,3));

const mat=new THREE.PointsMaterial({
  size:0.15,vertexColors:true,
  transparent:true,blending:THREE.AdditiveBlending
});
const points=new THREE.Points(geo,mat);
scene.add(points);

/* AUDIO — FIXED */
let actx, analyser, data, audioLevel=0;

async function initAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  await actx.resume(); // 🔥 MOST IMPORTANT FIX

  analyser=actx.createAnalyser();
  analyser.fftSize=256;
  data=new Uint8Array(analyser.frequencyBinCount);

  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const src=actx.createMediaStreamSource(stream);
  src.connect(analyser);
}

/* SHAPES */
const shapes=["sphere","cube","torus"];
let shapeIndex=0,currentShape="sphere";

function shapePos(i,p){
  const u=(i%100)/100*Math.PI*2;
  const v=Math.floor(i/100)/60*Math.PI;

  if(currentShape==="cube")
    return{x:((i%20)-10)*1.4*p,y:((i/20%20)-10)*1.4*p,z:((i/400)-10)*1.4*p};

  if(currentShape==="torus")
    return{x:(10+3*Math.cos(v))*Math.cos(u)*p,
           y:(10+3*Math.cos(v))*Math.sin(u)*p,
           z:3*Math.sin(v)};

  return{
    x:12*Math.sin(v)*Math.cos(u)*p,
    y:12*Math.sin(v)*Math.sin(u)*p,
    z:12*Math.cos(v)*p
  };
}

/* HAND */
let handX=0,handY=0,isFist=false,last=0;
const video=document.getElementById("video");

const hands=new Hands({
  locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({maxNumHands:1});

hands.onResults(r=>{
  if(!r.multiHandLandmarks)return;
  const l=r.multiHandLandmarks[0];

  handX=(0.5-l[8].x)*60;
  handY=(0.5-l[8].y)*45;

  isFist=Math.hypot(l[8].x-l[5].x,l[8].y-l[5].y)<0.18;

  const pinch=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y)<0.05;
  if(pinch && Date.now()-last>900){
    shapeIndex=(shapeIndex+1)%shapes.length;
    currentShape=shapes[shapeIndex];
    document.getElementById("mode").innerText="MODE: "+currentShape.toUpperCase();
    last=Date.now();
  }
});

/* START */
document.getElementById("start").onclick=async()=>{
  document.getElementById("start").style.display="none";
  await initAudio();

  new Camera(video,{
    onFrame:()=>hands.send({image:video}),
    width:640,height:480
  }).start();
};

/* ANIMATE */
function animate(){
  requestAnimationFrame(animate);

  if(analyser){
    analyser.getByteFrequencyData(data);
    audioLevel=data.reduce((a,b)=>a+b)/data.length/255;
  }

  const pulse=1+audioLevel*3; // 🔊 now reacts
  const p=geo.attributes.position.array;
  const c=geo.attributes.color.array;

  for(let i=0;i<COUNT;i++){
    const d=shapePos(i,pulse);
    const ix=i*3;

    if(isFist){
      p[ix]+= (handX-p[ix])*0.12;
      p[ix+1]+= (handY-p[ix+1])*0.12;
      p[ix+2]+= (0-p[ix+2])*0.12;
      c[ix]=1;c[ix+1]=0.2;c[ix+2]=0.4;
    }else{
      p[ix]+= (d.x-p[ix])*0.06;
      p[ix+1]+= (d.y-p[ix+1])*0.06;
      p[ix+2]+= (d.z-p[ix+2])*0.06;
      c[ix]=0.3+audioLevel;
      c[ix+1]=0.8;
      c[ix+2]=1;
    }
  }

  geo.attributes.position.needsUpdate=true;
  geo.attributes.color.needsUpdate=true;
  points.rotation.y+=0.004+audioLevel*0.04;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
